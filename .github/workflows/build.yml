name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'jetbrains'
          java-version: '21'

      - name: Build and test with Gradle
        run: >
          ./gradlew spotlessCheck assembleFdroidDebug assembleFdroidDebugAndroidTest
          testFdroidDebugUnitTest lintFdroidDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            app/build/reports/tests/**

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk

      - name: Android Lint Report
        uses: yutailang0119/action-android-lint@v6
        with:
          report-path: app/build/reports/lint-results-fdroidDebug.xml
        continue-on-error: false

